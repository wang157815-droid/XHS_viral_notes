# Base44 dev environment: single origin on port 3000 via nginx -> Next dev + FastAPI
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      - POSTGRES_USER=redmuse
      - POSTGRES_PASSWORD=redmuse_dev
      - POSTGRES_DB=redmuse
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/pg_init:/docker-entrypoint-initdb.d:ro
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redmuse -d redmuse"]
      interval: 10s
      timeout: 3s
      retries: 5
  redis:
    image: redis:7-alpine
    restart: on-failure
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
  spider-xhs:
    build:
      context: .
      dockerfile: .base44/Dockerfile.backend
    working_dir: /app
    command: ["sh", "-ec", "[ -d node_modules/crypto-js ] || npm install --no-audit; exec python backend/run.py --host 0.0.0.0 --port 8100"]
    volumes:
      - .:/app
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=redmuse
      - POSTGRES_PASSWORD=redmuse_dev
      - POSTGRES_DB=redmuse
      - BACKLOG_BACKEND=redis
      - TASK_RUNNER=inprocess
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8100/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
  frontend:
    image: node:22
    working_dir: /app/frontend
    command: ["sh", "-ec", "npm ci && exec npx next dev -H 0.0.0.0 -p 3000"]
    volumes:
      - .:/app
      - frontend-node-modules:/app/frontend/node_modules
    environment:
      - NEXT_PUBLIC_API_BASE_URL=/api/v1
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - WATCHPACK_POLLING=true
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s
  nginx:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./.base44/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - spider-xhs
      - frontend
    restart: on-failure
volumes:
  postgres-data:
  frontend-node-modules:
