    #     }
    #
    #     location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
    #         proxy_pass http://spider_app;
    #         expires 7d;
    #         add_header Cache-Control "public, immutable";
    #     }
    #
    #     location /api/ {
    #         proxy_pass http://spider_app;
    #         proxy_http_version 1.1;
