events {
    worker_connections 1024;
}

http {
    # 上游服务配置
    upstream redmuse_backend {
        server spider-xhs:8100;
    }

    upstream redmuse_frontend {
        server frontend:3000;
    }

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # ==========================================================================
    # HTTP -> HTTPS 重定向
    # ==========================================================================
    server {
        listen 80;
        server_name www.redmuse.cn redmuse.cn;

        # 强制将所有 HTTP 请求重定向到 HTTPS
        return 301 https://$host$request_uri;
    }

    # ==========================================================================
    # HTTPS 服务器
    # ==========================================================================
    server {
        listen 443 ssl http2;
        server_name www.redmuse.cn redmuse.cn;

        # SSL 证书路径
        ssl_certificate /etc/nginx/ssl/www.redmuse.cn.pem;
        ssl_certificate_key /etc/nginx/ssl/www.redmuse.cn.key;

        # SSL 安全配置
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # 安全头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # 请求体大小限制（用于文件上传）
        client_max_body_size 100M;

        # API接口（禁用缓存，支持 SSE/流式响应）
        location /api/ {
            proxy_pass http://redmuse_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE / 流式接口需要禁用代理缓冲
            proxy_buffering off;
            proxy_cache off;
            add_header X-Accel-Buffering "no" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            expires 0;

            # WebSocket支持（预留）
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 超时设置（分析任务可能较长）
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }

        # Next.js 构建静态资源
        location /_next/static/ {
            proxy_pass http://redmuse_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 30d;
            add_header Cache-Control "public, immutable" always;
        }

        # Next.js 内部资源与前端页面
        location /_next/ {
            proxy_pass http://redmuse_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://redmuse_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;
        }
    }
}
