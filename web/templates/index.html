<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="3;url=/login" />
    <title>RedMuse 已迁移</title>
    <style>
        :root {
        color-scheme: light;
        --brand: #ff4757;
        --ink: #2d2a26;
        --muted: #8a8580;
        --line: #f0eeeb;
        --bg: #fff8f5;
        }

        * {
            box-sizing: border-box;
        }

        body {
        margin: 0;
            min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top left, #ffe8e0 0, transparent 34%),
          linear-gradient(135deg, #fffdfb 0%, var(--bg) 100%);
        color: var(--ink);
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "Microsoft YaHei",
          sans-serif;
      }

      main {
        width: min(560px, calc(100vw - 40px));
        padding: 40px;
        border: 1px solid var(--line);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 20px 60px rgba(45, 42, 38, 0.08);
      }

      .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
        border-radius: 999px;
        background: #fff0ee;
        color: var(--brand);
        font-size: 12px;
        font-weight: 700;
      }

      h1 {
        margin: 18px 0 12px;
        font-size: 30px;
        line-height: 1.2;
      }

      p {
            margin: 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.8;
      }

      .actions {
            display: flex;
            flex-wrap: wrap;
        gap: 12px;
        margin-top: 28px;
        }

      a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        min-height: 40px;
        padding: 0 16px;
            border-radius: 10px;
        text-decoration: none;
        font-size: 14px;
            font-weight: 700;
      }

      .primary {
        background: var(--brand);
        color: #fff;
      }

      .secondary {
        border: 1px solid var(--line);
        color: var(--ink);
      }

      .hint {
        margin-top: 18px;
        font-size: 12px;
        }
    </style>
</head>
<body>
    <main>
      <span class="badge">Legacy UI retired</span>
      <h1>RedMuse 已迁移到新版工作台</h1>
      <p>
        旧版小红书爆文分析单页应用已停止承载业务功能。请使用新版 RedMuse 登录、对话中枢、历史中心、知识库与 Canvas 工作台。
      </p>
      <div class="actions">
        <a class="primary" href="/login">进入新版 RedMuse</a>
        <a class="secondary" href="/api/v1/health">查看新后端健康状态</a>
                    </div>
      <p class="hint">页面将在 3 秒后自动跳转到新版登录页。</p>
    </main>
</body>
</html>
